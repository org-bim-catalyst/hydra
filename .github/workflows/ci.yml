name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-build-and-test:
    name: Backend build, lint, and test (.NET 10)
    runs-on: windows-latest
    # AskLucy.Persistence.Tests runs against a real, shared test SQL Server instance rather
    # than a per-run Testcontainers instance (windows-latest's Docker daemon can't run that
    # Linux image — see PersistenceTestFixture.cs). Serialize this job so two concurrent runs
    # never reset/query the shared database at the same time; cancel-in-progress is false so
    # a newer push waits its turn instead of aborting a run that might already be mid-test.
    concurrency:
      group: backend-tests-shared-db
      cancel-in-progress: false
    defaults:
      run:
        working-directory: src/AskLucy.Web/ClientApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/AskLucy.Web/ClientApp/package-lock.json

      - name: Install ClientApp dependencies
        run: npm ci

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # TesseractOcrEngineTests (SPEC-015) exercises real OCR recognition, which needs an actual
      # .traineddata language pack. App_Data/ is gitignored (never committed — see README.md
      # "Deployment prerequisites"), so a fresh checkout has none; fetch just the one language
      # this test needs from the official tessdata repo rather than checking in a binary fixture.
      - name: Fetch Tesseract OCR trained data (eng) for TesseractOcrEngineTests
        working-directory: .
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/AskLucy.Web/App_Data/tessdata | Out-Null
          curl.exe --fail --silent --show-error -L -o src/AskLucy.Web/App_Data/tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata

      - name: Restore
        working-directory: .
        run: dotnet restore "Ask Lucy.sln"

      - name: Build
        working-directory: .
        run: dotnet build "Ask Lucy.sln" --no-restore --configuration Release

      - name: Lint (format check)
        working-directory: .
        run: dotnet format "Ask Lucy.sln" --no-restore --verify-no-changes --severity error

      - name: Test
        working-directory: .
        run: dotnet test "Ask Lucy.sln" --no-build --configuration Release --logger "trx" --results-directory TestResults
        env:
          PERSISTENCE_TESTS_CONNECTION_STRING: ${{ secrets.PERSISTENCE_TESTS_CONNECTION_STRING }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults

  frontend-build-lint-and-test:
    name: Frontend build, lint, and test (React 19 + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AskLucy.Web/ClientApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/AskLucy.Web/ClientApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: Playwright regression matrix
    runs-on: ubuntu-latest
    if: false
    defaults:
      run:
        working-directory: tests/AskLucy.E2E.Tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npm test
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

  deploy:
    name: Deploy to site4now.net
    needs: [backend-build-and-test, frontend-build-lint-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/AskLucy.Web/ClientApp/package-lock.json

      - name: Install ClientApp dependencies
        working-directory: src/AskLucy.Web/ClientApp
        run: npm ci

      - name: Publish
        run: dotnet publish src/AskLucy.Web --configuration Release --output publish/backend

      # IIS/ANCM keeps every loaded assembly file-locked for as long as the app process is
      # running (research/incident: three consecutive deploys failed with FTP 550 "process
      # cannot access the file" on whichever DLL actually changed — not transient, since it
      # reproduced on every retry). app_offline.htm is ANCM's documented signal to unload the
      # app and release those locks before the file copy, restored once the copy is done.
      # https://learn.microsoft.com/aspnet/core/host-and-deploy/aspnet-core-module
      - name: Take app offline (releases IIS/ANCM's file locks before the FTP sync)
        shell: pwsh
        run: |
          Set-Content -Path app_offline.htm -Value "Ask Lucy is being updated — back in a moment." -Encoding utf8
          curl.exe --fail --silent --show-error --user "${{ secrets.SITE4NOW_FTP_USERNAME }}:${{ secrets.SITE4NOW_FTP_PASSWORD }}" -T app_offline.htm "ftp://${{ secrets.SITE4NOW_FTP_SERVER }}/hydra/app_offline.htm"
          Start-Sleep -Seconds 10

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SITE4NOW_FTP_SERVER }}
          username: ${{ secrets.SITE4NOW_FTP_USERNAME }}
          password: ${{ secrets.SITE4NOW_FTP_PASSWORD }}
          local-dir: publish/backend/
          server-dir: /hydra/

      - name: Bring app back online
        if: always()
        shell: pwsh
        run: |
          curl.exe --fail --silent --show-error --user "${{ secrets.SITE4NOW_FTP_USERNAME }}:${{ secrets.SITE4NOW_FTP_PASSWORD }}" -Q "DELE /hydra/app_offline.htm" "ftp://${{ secrets.SITE4NOW_FTP_SERVER }}/"